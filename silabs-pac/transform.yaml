transforms:
  # ==================== Nonsecure and secure
  # Rename everything
  # Originally every peripheral is peri_ns::PeriNs and peri_s::PeriS
  # Merge everything into a common peri::Peri, peri::regs and peri::vals

  - !MergeEnums
    from: (.*)_n?s::vals::(.*)
    to: $1::vals::$2

  - !MergeFieldsets
    from: (.*)_n?s::regs::(.*)
    to: $1::regs::$2
    check: Layout

  - !MergeBlocks
    from: (.*)_n?s::(.*)
    to: $1::$2
    type: All

  - !MergeBlocks
    from: (.*)::(.*)(Ns|S)
    to: $1::$2
    type: All

  # ==================== GPIO
  - !MergeFieldsets
    from: gpio::regs::Port([abcd])(.+)
    to: gpio::regs::$2
    check: NoCheck

  - !MakeBlock
    blocks: gpio::Gpio
    from: port([abcd])_(.+)
    to_outer: port_$1
    to_inner: $2
    to_block: gpio::Port

    # Not all registers have a mode high, and chiptool seems to generate with all(), not any()
  - !AddRegisters
    block: gpio::Port
    registers:
      - name: modeh
        description: mode high
        byte_offset: 0x0C
        access: ReadWrite
        fieldset: gpio::regs::Modeh

    # GPIO Enums
  - !MergeEnums
    from: gpio::vals::Port.Mode.Mode\d
    to: gpio::vals::PortMode

    # ModeH and ModeL
  - !MergeFieldsets
    from: gpio::regs::Mode(h|l)
    to: gpio::regs::Mode
    check: NoCheck
  - !AddFields
    fieldset: gpio::regs::Mode
    fields:
      - name: mode2
        description: Mode N
        bit_offset: 8
        bit_size: 0x4
        enum: gpio::vals::PortMode
      - name: mode3
        description: Mode N
        bit_offset: 12
        bit_size: 0x4
        enum: gpio::vals::PortMode
      - name: mode4
        description: Mode N
        bit_offset: 16
        bit_size: 0x4
        enum: gpio::vals::PortMode
      - name: mode5
        description: Mode N
        bit_offset: 20
        bit_size: 0x4
        enum: gpio::vals::PortMode
      - name: mode6
        description: Mode N
        bit_offset: 24
        bit_size: 0x4
        enum: gpio::vals::PortMode
      - name: mode7
        description: Mode N
        bit_offset: 28
        bit_size: 0x4
        enum: gpio::vals::PortMode

  # RTC
  # Interrupt clear register not present in .svd
  - !AddRegisters
    block: sysrtc0::Sysrtc0
    registers:
      - name: grp0_if_clr
        description: SYSRTC0 Group 0 Interrupt Clear
        byte_offset: 0x2040
        access: ReadWrite
        fieldset: sysrtc0::regs::Grp0If

  # Timers

  # EFR32xG24: Timers 0&1 are 32 bit, 2 to 4 are 16 bit
  # LETimer is 24 bit, TBD
  #- !MergeEnums
  #  from: timer(0|1)::vals::(.*)
  #  to: timer32::vals::$2
#
#- !MergeFieldsets
#  from: timer(0|1)::regs::(.*)
#  to: timer32::regs::$3
#
#- !MergeEnums
#  from: timer(2|3|4)::vals::(.*)
#  to: timer16::vals::$2
#
#- !MergeFieldsets
#  from: timer(2|3|4)::regs::(.*)
#  to: timer16::regs::$3

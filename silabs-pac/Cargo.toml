[package]
name = "silabs-pac"
version = "0.1.0"
edition = "2021"

[dependencies]
critical-section = { version = "1.2.0", optional = true }
cortex-m = "0.7.8"
cortex-m-rt = { version = "0.7.6", optional = true }
vcell = "0.1.3"
defmt = { version = "1.1.1", optional = true }

[features]
default = ["critical-section", "efr32mg24"]
rt = ["cortex-m-rt/device"]
defmt = ["dep:defmt"]

# Chip family features (user-facing)
efr32mg24 = ["_xg24"]
# efr32mg21 = ["_xg21"]  # future

# Internal chip family features
_xg24 = []
# _xg21 = []  # future

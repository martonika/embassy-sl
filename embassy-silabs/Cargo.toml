[package]
name = "embassy-silabs"
version = "0.1.0"
edition = "2024"
description = "Embassy Hardware Abstraction Layer (HAL) for Silabs EFR32xG microcontrollers"

[features]
default = ["rt", "xg24", "_ns", "_time-driver"]
## Cortex-M runtime (enabled by default)
rt = ["silabs-pac/rt"]

## Enable defmt
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "embassy-hal-internal/defmt",
    "embassy-sync/defmt",
    #    "embassy-usb-driver/defmt",
    "embassy-embedded-hal/defmt",
]

## Chip families (user-facing, mutually exclusive)
xg24 = ["_xg24", "silabs-pac/efr32mg24"]
# xg21 = ["_xg21", "silabs-pac/efr32mg21"]  # future

## Internal chip family features
_xg24 = ["_eusart", "_i2c1", "_usart0", "_iadc", "_wdog"]
# _xg21 = []  # future - different peripherals

## Board support features (automatically enable correct chip family)
board-brd4186c = ["xg24"] # xG24 Dev Kit (EFR32MG24)
board-brd2601b = ["xg24"] # Thunderboard Sense 2 (EFR32MG24)

## Peripheral availability features (internal)
_eusart = []
_i2c1 = []
_usart0 = []
_iadc = []
_wdog = []

## Secure / nonsecure
_ns = []
_s = []

_time-driver = [
    "dep:embassy-time-driver",
    "dep:embassy-time",
    "dep:embassy-executor",
    "embassy-time-driver?/tick-hz-32_768",
    "dep:embassy-time-queue-utils",
    "embassy-embedded-hal/time",
]

## Memory LCD driver support (LS013B7DH03 and similar displays)
memlcd-driver = ["dep:ls013b7dh03", "dep:embedded-graphics"]

## RAIL proprietary radio (requires local Simplicity SDK via SILABS_SDK)
rail = ["dep:silabs-rail-sys", "dep:silabs-csdk"]

## Bluetooth LE host + controller (single-protocol RAIL, not multiprotocol)
ble = [
    "dep:silabs-bluetooth-sys",
    "dep:silabs-csdk",
    "silabs-csdk/ble",
    "silabs-rail-sys/rail",
]

## Bluetooth Mesh provisionee node (requires `ble`)
btmesh = [
    "ble",
    "dep:silabs-btmesh-sys",
    "silabs-csdk/btmesh",
    "silabs-btmesh-sys/btmesh",
    "silabs-bluetooth-sys/psa-crypto",
]

[dependencies]
cortex-m = "0.7.8"
cortex-m-rt = "0.7.6"
critical-section = "1.2.0"
defmt = { version = "1.1.1", optional = true }
defmt-rtt = { version = "1.3.0", optional = true }

embassy-time = { git = "https://github.com/embassy-rs/embassy.git", optional = true }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy.git", optional = true, features = [
    "tick-hz-32_768",
] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", optional = true, features = [
    "platform-cortex-m",
] }
embassy-hal-internal = { version = "0.5.0", features = [
    "cortex-m",
    "prio-bits-3",
], git = "https://github.com/embassy-rs/embassy.git" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy.git" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy.git", optional = true }
#embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy.git" }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.7.1"
embedded-graphics-core = "0.4"
embedded-storage = "0.3.1"
silabs-pac = { version = "0.1.0", path = "../silabs-pac", features = ["rt"] }
futures-util = { version = "0.3.33", default-features = false }
bitflags = "2.13.1"
embedded-io-async = "0.7.0"

silabs-rail-sys = { path = "../silabs-rail-sys", optional = true, default-features = false, features = [
    "rail",
] }
silabs-csdk = { path = "../silabs-csdk", optional = true, default-features = false }
silabs-bluetooth-sys = { path = "../silabs-bluetooth-sys", optional = true, default-features = false, features = [
    "ble",
] }
silabs-btmesh-sys = { path = "../silabs-btmesh-sys", optional = true, default-features = false, features = [
    "btmesh",
] }

# Optional dependencies for memory LCD driver
ls013b7dh03 = { version = "0.4.2", optional = true }
embedded-graphics = { version = "0.8.2", optional = true }

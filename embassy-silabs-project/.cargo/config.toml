[target.thumbv8m.main-none-eabi] # <-change for your platform
runner = [
    "probe-rs", "run",
    "--chip", "EFR32MG24B220F1536IM48",
    "--chip-description-path", "target-desc/EFR32MG24_Series.yaml",
    #"--log-format", "{t:010} {[{L}]%bold} {s}  {{c} {ff}:{l:1}%dimmed}",
    #"--connect-under-reset",
    #"--log-file", "log.txt"
]

[build]
target = "thumbv8m.main-none-eabi" # <-change for your platform

[env]
DEFMT_LOG = "trace" # <- can change to info, warn, or error

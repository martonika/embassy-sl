[package]
name = "embassy-silabs-project"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
cortex-m = { version = "0.7.8", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.6"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
silabs-pac = { version = "0.1.0", path = "../silabs-pac", features = [
    "rt",
    "critical-section",
    "cortex-m-rt",
] }
embassy-silabs = { version = "0.1.0", path = "../embassy-silabs", features = [
    "defmt",
    "board-brd4186c",
] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git" }
static_cell = "2.1.1"
embedded-graphics = "0.8"
libm = "0.2"
heapless = "0.9.3"

[dev-dependencies]
embedded-test = "0.7.1"
